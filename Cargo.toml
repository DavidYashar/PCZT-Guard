[workspace]
resolver = "2"
members = [
    "crates/pczt-guard-cli",
    "crates/pczt-guard-core",
    "crates/pczt-guard-signer",
    "crates/pczt-guard-wasm",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/DavidYashar/PCZT-Guard"

# Every Zcash crate is pinned to one librustzcash release set. Mixing the stable and
# pre-release lines produces type mismatches; see PCZT-Guard-Design.md §10.
[workspace.dependencies]
# Default features are off so that the browser build can leave halo2's multicore (and its
# rayon dependency) out; crates that need circuits opt in.
orchard = { version = "0.16", default-features = false }
pczt = { version = "=0.10.0-pre.2", features = ["signer", "zcp-builder"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
zcash_address = "=0.14.0-pre.2"
zcash_keys = { version = "=0.17.0-pre.2", default-features = false, features = ["orchard"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_protocol = "=0.11.0-pre.1"

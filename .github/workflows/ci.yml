name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The browser build must keep working: it is half the product, and the workspace pins
      # `orchard` with default features off precisely so halo2's multicore stays out.
      - name: Build the wasm crate
        run: cargo check -p pczt-guard-wasm --target wasm32-unknown-unknown

  web-demo:
    name: Browser demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # `jetli/wasm-pack-action` renamed across filesystems on current runners and failed with
      # EXDEV. taiki-e/install-action downloads a prebuilt binary and caches it.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Install
        working-directory: web-demo
        run: npm ci

      - name: wasm
        working-directory: web-demo
        run: npm run wasm

      - name: Type-check and bundle
        working-directory: web-demo
        run: npm run build

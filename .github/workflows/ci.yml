name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only, stated explicitly: these jobs only fetch the repository, and an explicit block
# stops a repository-wide default of read/write from applying.
permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      # The browser build must keep working: it is half the product, and the workspace pins
      # `orchard` with default features off precisely so halo2's multicore stays out.
      - name: Build the wasm crate
        run: cargo check -p pczt-guard-wasm --target wasm32-unknown-unknown

  web-demo:
    name: Browser demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      # `jetli/wasm-pack-action` renamed across filesystems on current runners and failed with
      # EXDEV. taiki-e/install-action downloads a prebuilt binary and caches it.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Install
        working-directory: web-demo
        run: npm ci

      - name: wasm
        working-directory: web-demo
        run: npm run wasm

      - name: Type-check and bundle
        working-directory: web-demo
        run: npm run build

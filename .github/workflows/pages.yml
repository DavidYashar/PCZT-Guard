name: Pages

# Publishes the browser demo. Separate from ci.yml on purpose: a deployment problem must not
# hide a test failure, and vice versa.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Install
        working-directory: web-demo
        run: npm ci

      - name: Compile the verifier to WebAssembly
        working-directory: web-demo
        run: npm run wasm

      # The samples behind ?sample=..., built by xtask. Without them the page loads but every
      # sample button reports a missing fixture.
      - name: Build the sample fixtures
        working-directory: web-demo
        run: npm run fixtures

      - name: Type-check and bundle
        working-directory: web-demo
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

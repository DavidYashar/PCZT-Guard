name: Pages

# Publishes the browser demo. Separate from ci.yml on purpose: a deployment problem must not
# hide a test failure, and vice versa.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    # Only redeploy when something the site is built from actually changed: a README edit
    # should not recompile the wasm.
    paths:
      - "web-demo/**"
      - "crates/pczt-guard-core/**"
      - "crates/pczt-guard-wasm/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not tags: a moved tag would let an upstream
# compromise run code in a job that can publish the verifier itself. Bump these deliberately.
#   dtolnay/rust-toolchain  b725eda525362e7cf34af9a7243cac1e3f01a7ec  (= stable)
#   Swatinem/rust-cache     d1527c8f67ef9af357290475d4af4b0fab8f12e0  (= v2)
#   taiki-e/install-action  a4d3f3f761dcd95cce1b72cb61cb6d1963438177  (= v2)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Install
        working-directory: web-demo
        run: npm ci

      - name: Compile the verifier to WebAssembly
        working-directory: web-demo
        run: npm run wasm

      # The samples behind ?sample=..., built by xtask. Without them the page loads but every
      # sample button reports a missing fixture.
      - name: Build the sample fixtures
        working-directory: web-demo
        run: npm run fixtures

      - name: Type-check and bundle
        working-directory: web-demo
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that publishes holds a credential. The build job runs third-party actions
    # and must not be able to deploy on its own.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

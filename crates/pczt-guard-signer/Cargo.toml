[package]
name = "pczt-guard-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reference signer for Ironwood PCZTs, which zcash-devtool cannot sign"

[[bin]]
name = "pczt-guard-signer"
path = "src/main.rs"

[dependencies]
bip39 = { version = "2", default-features = false, features = ["std"] }
orchard = { workspace = true }
pczt = { workspace = true, features = ["orchard", "sapling", "signer", "std"] }
pczt-guard-core = { path = "../pczt-guard-core" }
rand = { workspace = true }
rand_core = { workspace = true }
zcash_keys = { workspace = true, features = ["unstable-frost"] }
zcash_protocol = { workspace = true }
zip32 = "0.3"

[dev-dependencies]
xtask = { path = "../../xtask" }

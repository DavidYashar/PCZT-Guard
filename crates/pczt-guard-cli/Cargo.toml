[package]
name = "pczt-guard-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Check a Zcash PCZT before signing it"

[[bin]]
name = "pczt-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
orchard = { workspace = true }
pczt-guard-core = { path = "../pczt-guard-core" }
serde_json = "1"
zcash_keys = { workspace = true }
zcash_protocol = { workspace = true }

[dev-dependencies]
xtask = { path = "../../xtask" }

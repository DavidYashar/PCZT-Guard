[package]
name = "pczt-guard-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Offline pre-signing verifier for Zcash PCZTs"

[dependencies]
orchard = { workspace = true }
pczt = { workspace = true, features = ["orchard", "sapling", "std", "transparent"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.2", default-features = false }
zcash_address = { workspace = true }
zcash_protocol = { workspace = true }

[dev-dependencies]
xtask = { path = "../../xtask" }
